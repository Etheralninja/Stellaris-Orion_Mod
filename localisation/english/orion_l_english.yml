l_english:
  orion_civic: "Orion Collective"
  orion_civic_desc: "The Orion civilization is a unique gestalt consciousness, a collective of minds that have merged into a single entity. This civic represents the pinnacle of their technological and social evolution, allowing them to harness the full potential of their collective intelligence. The Orion civilization thrives on unity, energy, minerals, research, and alloys, making them a formidable force in the galaxy." 
  orion_civic_effect: "This civic provides a significant boost to the production of unity, energy, minerals, research, and alloys, reflecting the Orion civilization's advanced capabilities and their ability to work together as a single entity."