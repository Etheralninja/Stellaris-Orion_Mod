l_french:
  orion_civic: "Collectif Orion"
  orion_civic_desc: "La civilisation Orion est une conscience gestalt unique, un collectif d'esprits ayant fusionné en une seule entité. Ce mode de gouvernement représente le sommet de leur évolution technologique et sociale, leur permettant d'exploiter tout le potentiel de leur intelligence collective. La civilisation Orion prospère sur l'unité, l'énergie, les minerais, la recherche et les alliages, ce qui en fait une force redoutable dans la galaxie." 
  orion_civic_effect: "Ce mode de gouvernement offre un important bonus à la production d'unité, d'énergie, de minerais, de recherche et d'alliages, reflétant les capacités avancées de la civilisation Orion et leur capacité à travailler ensemble comme une seule entité."